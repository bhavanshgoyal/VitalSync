# VitalSync full stack.
#
# Start order is enforced by health checks rather than depends_on alone: the
# backend runs Flyway migrations at boot and will fail fast against a database
# that is still initialising, and it is pointless to accept telemetry before the
# triage service can answer.

services:

  postgres:
    image: postgres:16-alpine
    container_name: vitalsync-postgres
    environment:
      POSTGRES_DB: vitalsync
      POSTGRES_USER: vitalsync
      POSTGRES_PASSWORD: ${VITALSYNC_DB_PASSWORD:-vitalsync}
    volumes:
      - vitalsync-pgdata:/var/lib/postgresql/data
    ports:
      - "${VITALSYNC_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalsync -d vitalsync"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    container_name: vitalsync-ml
    ports:
      - "${VITALSYNC_ML_PORT:-8000}:8000"
    environment:
      VITALSYNC_ARTIFACTS: /app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: vitalsync-backend
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "${VITALSYNC_PORT:-8080}:8080"
    environment:
      VITALSYNC_DB_URL: jdbc:postgresql://postgres:5432/vitalsync
      VITALSYNC_DB_USER: vitalsync
      VITALSYNC_DB_PASSWORD: ${VITALSYNC_DB_PASSWORD:-vitalsync}
      VITALSYNC_ML_URL: http://ml-service:8000
      VITALSYNC_JWT_SECRET: ${VITALSYNC_JWT_SECRET:-change-me-vitalsync-demo-secret-key-32b}
      VITALSYNC_DEMO_USER: ${VITALSYNC_DEMO_USER:-clinician}
      VITALSYNC_DEMO_PASSWORD: ${VITALSYNC_DEMO_PASSWORD:-vitalsync-demo}

      # Both LLM tiers are off by default. The deterministic tier alone keeps
      # the system fully functional, so a first run needs no keys and no models.
      VITALSYNC_OLLAMA_ENABLED: ${VITALSYNC_OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}

      VITALSYNC_GEMINI_ENABLED: ${VITALSYNC_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    extra_hosts:
      # Lets the Ollama tier reach a model server running on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  vitalsync-pgdata:
